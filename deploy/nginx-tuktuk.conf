# /etc/nginx/sites-available/tuktuk.conf
# Site Suivi Tuk-tuk & Cyclo -> application Node sur 127.0.0.1:3002
# Fichier NOUVEAU : ne modifie aucun autre site.

server {
    server_name tuktuk.vitafoampointage.com;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tuktuk.vitafoampointage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tuktuk.vitafoampointage.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name tuktuk.vitafoampointage.com;

    if ($host = tuktuk.vitafoampointage.com) {
        return 301 https://$host$request_uri;
    }
    return 404;
}
